name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S src -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME"
          "build/bin/Release/snesapu.dll"
          --verify-tag
          --generate-notes
          --title "$env:GITHUB_REF_NAME"
